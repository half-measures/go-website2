version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./cmd/web/config.json:/app/cmd/web/config.json
      - ./tls:/app/tls
    restart: unless-stopped

  services:
    mysql:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: rootpass
        MYSQL_DATABASE: movie_trailers
        MYSQL_USER: user
        MYSQL_PASSWORD: password
      ports:
        - "3306:3306"
      volumes:
        - ./mysql-data:/var/lib/mysql

    # Add your Go app service here later (e.g., web server)